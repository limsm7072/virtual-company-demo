<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수호컴퍼니</title>
<style>
  @font-face { font-family:'Dot'; src:url('https://fonts.gstatic.com/s/dotgothic16/v17/v6-QGYjBJFKgyw5nSoDAGE7L435YPFrT.woff2') format('woff2'); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Dot','DotGothic16','Malgun Gothic',monospace;background:#2a2a1a;color:#f0e8d0;
    overflow-x:hidden;max-width:480px;margin:0 auto;
    border-left:2px solid #4a4a2a;border-right:2px solid #4a4a2a;
    min-height:100vh;image-rendering:pixelated;
  }

  /* ===== 레트로 HUD ===== */
  .hud{
    background:#3a3520;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid #5a5530;position:sticky;top:0;z-index:50;
  }
  .hud-left{display:flex;flex-direction:column;gap:1px}
  .hud-day{font-size:9px;color:#a09870}
  .hud-grade{font-size:13px;color:#ffe066;text-shadow:1px 1px 0 #806000}
  .exp-wrap{display:flex;align-items:center;gap:4px;margin-top:2px}
  .exp-lbl{font-size:8px;color:#a09870}
  .exp-bar{width:80px;height:8px;background:#1a1a10;border:2px solid #5a5530;image-rendering:pixelated}
  .exp-fill{height:100%;background:#66cc44;transition:width 0.5s}
  .hud-right{display:flex;gap:8px}
  .hud-stat{text-align:center;background:#2a2510;padding:4px 8px;border:2px solid #5a5530}
  .hud-stat .val{font-size:11px;font-weight:bold}
  .hud-stat .lbl{font-size:7px;color:#8a8060}

  /* ===== 오피스 캔버스 ===== */
  .office-wrap{position:relative;width:100%;height:240px;background:#1a1a10;border-bottom:3px solid #5a5530;overflow:hidden}
  .office-canvas{width:100%;height:100%;display:block;image-rendering:pixelated}

  /* 루나 */
  .luna{
    position:absolute;top:6px;right:6px;z-index:20;
    background:#3a2a20;border:2px solid #cc8844;padding:6px 8px;max-width:160px;
    box-shadow:2px 2px 0 rgba(0,0,0,0.5);
  }
  .luna .lh{display:flex;align-items:center;gap:4px;margin-bottom:3px}
  .luna .la{width:14px;height:14px;background:#cc8844;border:1px solid #aa6622;display:flex;align-items:center;justify-content:center;font-size:8px}
  .luna .ln{font-size:8px;color:#ffaa44}
  .luna .lm{font-size:8px;color:#ddb888;line-height:1.3}

  /* ===== 탭 (레트로 버튼) ===== */
  .tabs{
    display:flex;background:#3a3520;border-bottom:3px solid #5a5530;
  }
  .tab{
    flex:1;padding:8px 0;font-size:10px;color:#8a8060;background:#2a2510;
    border:none;border-right:2px solid #5a5530;cursor:pointer;font-family:inherit;
    text-align:center;transition:all 0.1s;
  }
  .tab:last-child{border-right:none}
  .tab.active{background:#4a4520;color:#ffe066;box-shadow:inset 0 -3px 0 #ffe066}
  .tab:active{background:#5a5530}

  /* ===== 컨텐츠 ===== */
  .content{padding:8px;padding-bottom:60px}

  /* 레트로 카드 */
  .rc{
    background:#3a3520;border:2px solid #5a5530;margin-bottom:8px;
    box-shadow:2px 2px 0 rgba(0,0,0,0.4);
  }
  .rc-head{
    background:#4a4520;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:2px solid #5a5530;
  }
  .rc-title{font-size:11px;color:#f0e8d0}
  .rc-badge{
    font-size:9px;padding:2px 6px;border:2px solid;font-weight:bold;
  }
  .rc-badge.high{color:#44ff44;border-color:#22aa22;background:#1a3a1a}
  .rc-badge.mid{color:#ffcc00;border-color:#aa8800;background:#3a2a1a}
  .rc-badge.low{color:#ff4444;border-color:#aa2222;background:#3a1a1a}
  .rc-body{padding:6px 8px}

  /* KPI 바 (레트로) */
  .kbar{height:8px;background:#1a1a10;border:2px solid #5a5530;margin-bottom:8px}
  .kbar-fill{height:100%;transition:width 0.5s}
  .kbar-fill.high{background:#44aa22}
  .kbar-fill.mid{background:#ccaa00}
  .kbar-fill.low{background:#aa2222}

  /* 미션 아이템 (레트로 리스트) */
  .mi{
    display:flex;align-items:center;gap:6px;padding:6px;margin-bottom:3px;
    background:#2a2510;border:1px solid #4a4520;cursor:pointer;
  }
  .mi:active{background:#4a4520;transform:scale(0.98)}
  .mi-ck{
    width:14px;height:14px;border:2px solid #5a5530;background:#1a1a10;
    display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;
  }
  .mi.done .mi-ck{background:#22aa22;border-color:#44cc44;color:#fff}
  .mi.fail .mi-ck{background:#aa2222;border-color:#cc4444;color:#fff}
  .mi-txt{font-size:10px;flex:1}
  .mi.done .mi-txt{color:#6a6a4a;text-decoration:line-through}

  /* 직원 행 */
  .er{
    display:flex;align-items:center;gap:6px;padding:6px;margin-bottom:3px;
    background:#2a2510;border:1px solid #4a4520;
  }
  .er-face{
    width:20px;height:20px;border:2px solid;display:flex;align-items:center;
    justify-content:center;font-size:10px;image-rendering:pixelated;
  }
  .er-info{flex:1}
  .er-info .n{font-size:10px}
  .er-info .r{font-size:8px}
  .er-mood{font-size:12px}

  /* 부서추가 */
  .add-c{
    border:2px dashed #5a5530;padding:16px;text-align:center;color:#5a5530;
    font-size:10px;cursor:pointer;margin-bottom:8px;
  }
  .add-c:active{border-color:#ffe066;color:#ffe066}

  /* ===== 리포트 (레트로 감성) ===== */
  .rpt-header{text-align:center;padding:12px 0;border-bottom:2px dashed #5a5530;margin-bottom:8px}
  .rpt-header .icon{font-size:24px}
  .rpt-header .grade{font-size:14px;color:#ffe066;margin-top:4px;text-shadow:1px 1px 0 #806000}
  .rpt-header .sub{font-size:8px;color:#8a8060}

  .rpt-stats{display:flex;gap:4px;margin-bottom:8px}
  .rpt-stat{
    flex:1;text-align:center;padding:8px 4px;
    background:#2a2510;border:2px solid #5a5530;
  }
  .rpt-stat .v{font-size:16px;font-weight:bold}
  .rpt-stat .l{font-size:7px;color:#8a8060;margin-top:2px}

  .rpt-dept{
    display:flex;justify-content:space-between;align-items:center;
    padding:5px 6px;border-bottom:1px solid #3a3520;font-size:10px;
  }
  .rpt-dept:last-child{border-bottom:none}
  .rpt-bar-mini{width:60px;height:6px;background:#1a1a10;border:1px solid #4a4520}
  .rpt-bar-fill{height:100%}

  .rpt-next{
    margin-top:8px;padding:8px;text-align:center;
    background:#2a2510;border:2px solid #5a5530;font-size:9px;color:#a09870;
  }
  .rpt-next .target{color:#ffe066;font-size:11px}

  /* 스탯 변화 표시 */
  .rpt-change{font-size:8px;margin-top:2px}
  .rpt-change.up{color:#44ff44}
  .rpt-change.down{color:#ff4444}

  /* ===== 채용 시트 ===== */
  .sh-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100}
  .sh-bg.open{display:block}
  .sh{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
    width:100%;max-width:480px;max-height:60vh;overflow-y:auto;
    background:#3a3520;border:2px solid #5a5530;border-bottom:none;
    padding:12px 8px;z-index:101;transition:transform 0.3s;
  }
  .sh-bg.open .sh{transform:translateX(-50%) translateY(0)}
  .sh h3{font-size:11px;color:#ffe066;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #5a5530}

  .hr{
    display:flex;align-items:center;gap:8px;padding:8px 6px;
    background:#2a2510;border:2px solid #4a4520;margin-bottom:4px;cursor:pointer;
  }
  .hr:active{background:#4a4520;border-color:#ffe066}
  .hr.locked{opacity:0.3;pointer-events:none}
  .hr-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid}
  .hr-info{flex:1}
  .hr-info .t{font-size:10px;font-weight:bold}
  .hr-info .d{font-size:8px;color:#8a8060}
  .hr-cost{font-size:9px;color:#66cc44;font-weight:bold}

  /* ===== 하단바 ===== */
  .bbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:50;
    background:#3a3520;border-top:3px solid #5a5530;
    padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));
    display:flex;gap:4px;
  }
  .bb{
    flex:1;padding:8px 0;border:2px solid;font-family:inherit;
    font-size:9px;cursor:pointer;text-align:center;
    box-shadow:2px 2px 0 rgba(0,0,0,0.3);transition:all 0.1s;
  }
  .bb:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,0.3)}
  .bb.pri{background:#4a6a2a;border-color:#66aa44;color:#ccff88}
  .bb.sec{background:#2a2510;border-color:#5a5530;color:#a09870}

  /* 토스트 */
  .toast{
    position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:200;
    background:#3a3520;border:2px solid #66cc44;color:#ccff88;
    padding:6px 14px;font-size:9px;display:none;
    box-shadow:2px 2px 0 rgba(0,0,0,0.5);font-family:inherit;
  }
  .toast.bad{border-color:#cc4444;color:#ff8888}
</style>
</head>
<body>

<div class="hud">
  <div class="hud-left">
    <div class="hud-day" id="hudDay">DAY 001</div>
    <div class="hud-grade" id="hudGrade">🏠 개인사무실</div>
    <div class="exp-wrap">
      <span class="exp-lbl">EXP</span>
      <div class="exp-bar"><div class="exp-fill" id="expBar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="hud-right">
    <div class="hud-stat"><div class="val" id="hudKpi" style="color:#ffcc00">0%</div><div class="lbl">KPI</div></div>
    <div class="hud-stat"><div class="val" id="hudEmp">2</div><div class="lbl">직원</div></div>
    <div class="hud-stat"><div class="val" id="hudMoney" style="color:#66cc44">50K</div><div class="lbl">자금</div></div>
  </div>
</div>

<div class="office-wrap" id="officeWrap">
  <canvas class="office-canvas" id="canvas"></canvas>
  <div class="luna">
    <div class="lh"><div class="la">☽</div><div class="ln">루나 비서실장</div></div>
    <div class="lm" id="lunaMsg">CEO님, 좋은 아침! 미션을 완료해주세요.</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('missions')">📋 미션</button>
  <button class="tab" onclick="switchTab('employees')">👥 직원</button>
  <button class="tab" onclick="switchTab('report')">📊 리포트</button>
</div>

<div class="content" id="content"></div>

<div class="sh-bg" id="shBg" onclick="closeSheet()">
  <div class="sh" onclick="event.stopPropagation()">
    <h3>▸ <span id="shTitle">직원 채용</span></h3>
    <div id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="bbar">
  <button class="bb sec" onclick="newDay()">📅 다음 날</button>
  <button class="bb pri" onclick="openSheetAll()">👔 채용</button>
  <button class="bb sec" onclick="resetGame()">↻ 리셋</button>
</div>

<script>
const G=[
  {name:'개인사무실',icon:'🏠',minKpi:0,maxDept:2,exp:100,wins:1,desks:2,plants:1,
   wall:'#d4c8a8',wl:'#c8bc98',trim:'#8B7355',f1:'#B8864E',f2:'#A67842',fh:'#C4925A'},
  {name:'스타트업',icon:'🏢',minKpi:40,maxDept:3,exp:300,wins:2,desks:3,plants:1,
   wall:'#ccd4d8',wl:'#bcc8cc',trim:'#6688aa',f1:'#a8a098',f2:'#989088',fh:'#b8b0a8'},
  {name:'중소기업',icon:'🏗️',minKpi:55,maxDept:4,exp:600,wins:2,desks:4,plants:2,
   wall:'#d8d4cc',wl:'#ccc8c0',trim:'#887744',f1:'#B8864E',f2:'#A67842',fh:'#C4925A'},
  {name:'중견기업',icon:'🏛️',minKpi:65,maxDept:5,exp:1000,wins:3,desks:5,plants:2,
   wall:'#e0dcd4',wl:'#d4d0c4',trim:'#aa9966',f1:'#c49a6c',f2:'#b08850',fh:'#d4a878'},
  {name:'대기업',icon:'🏙️',minKpi:75,maxDept:6,exp:2000,wins:3,desks:6,plants:3,
   wall:'#e8e4dc',wl:'#dcd8cc',trim:'#bbaa88',f1:'#889898',f2:'#788888',fh:'#99a8a8'},
  {name:'글로벌기업',icon:'🌍',minKpi:85,maxDept:6,exp:9999,wins:4,desks:8,plants:3,
   wall:'#f0ece4',wl:'#e4e0d4',trim:'#ccbb99',f1:'#3a3a3a',f2:'#2a2a2a',fh:'#4a4a4a'},
];
const E=[
  {rank:'인턴',c:'#88aaaa',bg:'#556666',cost:0,bonus:0},
  {rank:'사원',c:'#66aaee',bg:'#336699',cost:0,bonus:5},
  {rank:'대리',c:'#66cc66',bg:'#338833',cost:3900,bonus:10},
  {rank:'과장',c:'#eeaa44',bg:'#aa6600',cost:6900,bonus:15},
  {rank:'부장',c:'#cc88ee',bg:'#774499',cost:9900,bonus:20},
  {rank:'임원',c:'#ee6666',bg:'#993333',cost:14900,bonus:30},
];
const D=[
  {id:'exercise',name:'운동부',icon:'💪',ms:['러닝 30분','스트레칭','근력운동']},
  {id:'sleep',name:'수면부',icon:'😴',ms:['23시 취침','7시간 수면','아침 햇빛']},
  {id:'study',name:'학습부',icon:'📚',ms:['독서 30분','강의 수강','노트 정리']},
  {id:'health',name:'건강부',icon:'🥗',ms:['물 8잔','영양제','건강 식사']},
  {id:'finance',name:'재정부',icon:'💰',ms:['가계부','절약 실천','저축']},
  {id:'mental',name:'멘탈부',icon:'🧘',ms:['명상 10분','감사일기','디톡스']},
];
const NM=['김수호','이하늘','박지민','최윤서','정다은','강민준','조서연','윤태호','한소율','임재현','송예린','오동현','나영호','문서진','백승우','허지연'];
const SK=['#FFDBB4','#E8B88A','#D4A574','#C68642'];
const HR=['#222','#4A2800','#8B4513','#333','#1a1a1a'];

const rnd=a=>a[Math.floor(Math.random()*a.length)];
let S={money:50000,exp:0,lv:1,gi:0,day:1,depts:[],used:[],tab:'missions'};

function rN(){const a=NM.filter(n=>!S.used.includes(n));const n=a.length?rnd(a):rnd(NM);S.used.push(n);return n;}

function mkEmp(gi){return{name:rN(),gi,mood:'normal',skin:rnd(SK),hair:rnd(HR),waveT:0};}

function init(){
  S.depts=D.slice(0,2).map(t=>({
    ...t,kpi:50,emps:[mkEmp(0),mkEmp(1)],
    missions:t.ms.map(m=>({text:m,st:'todo'})),
  }));
  setupCanvas();render();requestAnimationFrame(loop);
}

// ===== CANVAS =====
let cv,cx,W,H,PX,aT=0,clickC=-1,clickTO,waveChars={};

function setupCanvas(){
  cv=document.getElementById('canvas');
  const r=cv.parentElement.getBoundingClientRect();
  PX=3;W=Math.floor(r.width/PX);H=Math.floor(r.height/PX);
  cv.width=W;cv.height=H;cv.style.imageRendering='pixelated';
  cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
  cv.addEventListener('click',onCvClick);
}

function onCvClick(e){
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/PX,my=(e.clientY-r.top)/PX;
  let ci=0;
  S.depts.forEach((d,di)=>{
    d.emps.forEach((emp,ei)=>{
      const p=charPosInDept(di,ei);
      if(mx>=p.x-8&&mx<=p.x+8&&my>=p.y-18&&my<=p.y+4){
        clickC=ci;waveChars[ci]=aT;clearTimeout(clickTO);clickTO=setTimeout(()=>{clickC=-1;},3000);return;
      }
      ci++;
    });
  });
}

function deptLayout(){
  // 부서별 영역 계산: 가로로 나란히 배치
  const nd=S.depts.length;
  const fy=Math.floor(H*0.55);
  const dw=Math.floor(W/nd);
  return S.depts.map((d,di)=>({
    x:di*dw, w:dw, fy, dept:d, di
  }));
}

function charPosInDept(di,ei){
  const nd=S.depts.length;
  const fy=Math.floor(H*0.55);
  const dw=Math.floor(W/nd);
  const sx=di*dw;
  const cols=Math.max(1,Math.floor((dw-8)/18));
  const col=ei%cols, row=Math.floor(ei/cols);
  return{x:sx+10+col*18, y:H-12-row*24};
}

function loop(ts){aT=ts/1000;draw();requestAnimationFrame(loop);}

function draw(){
  if(!cx)return;
  const g=G[S.gi];

  // 벽
  cx.fillStyle=g.wall;cx.fillRect(0,0,W,H*0.55);
  cx.fillStyle=g.wl;
  for(let y=0;y<H*0.55;y+=10)cx.fillRect(0,y,W,1);

  // 걸레받이
  const fy=Math.floor(H*0.55);
  cx.fillStyle=g.trim;cx.fillRect(0,fy-2,W,4);

  // 바닥
  for(let y=fy+2;y<H;y+=6){
    for(let x=0;x<W;x+=14){
      const sh=((y/6|0)%2)*7;
      cx.fillStyle=g.f1;cx.fillRect(x+sh,y,13,5);
      cx.fillStyle=g.f2;cx.fillRect(x+sh,y+5,13,1);
      cx.fillStyle=g.fh;cx.fillRect(x+sh+2,y+1,9,2);
    }
  }

  // 창문
  for(let i=0;i<g.wins;i++){
    const wx=6+i*24,wy=4;
    cx.fillStyle='#eee';cx.fillRect(wx,wy,18,16);
    cx.fillStyle='#88ccee';cx.fillRect(wx+2,wy+2,6,5);
    cx.fillStyle='#aaddff';cx.fillRect(wx+10,wy+2,6,5);
    cx.fillStyle='#77bbdd';cx.fillRect(wx+2,wy+9,6,5);
    cx.fillStyle='#99ccee';cx.fillRect(wx+10,wy+9,6,5);
    cx.fillStyle='#eee';cx.fillRect(wx+8,wy,2,16);cx.fillRect(wx,wy+7,18,2);
  }

  // 책상
  for(let i=0;i<g.desks;i++){
    const row=Math.floor(i/5),col=i%5;
    const dx=6+col*24,dy=fy+4+row*16;
    cx.fillStyle='#A0782C';cx.fillRect(dx,dy,16,5);
    cx.fillStyle='#B8864E';cx.fillRect(dx+1,dy+1,14,3);
    cx.fillStyle='#8B6914';cx.fillRect(dx+2,dy+5,2,3);cx.fillRect(dx+12,dy+5,2,3);
    cx.fillStyle='#444';cx.fillRect(dx+5,dy-4,6,4);
    cx.fillStyle='#66ddff';cx.fillRect(dx+6,dy-3,4,2);
  }

  // 화분
  for(let i=0;i<g.plants;i++){
    const px=W-8-i*16,py=fy-1;
    cx.fillStyle='#8B4513';cx.fillRect(px,py,7,5);
    cx.fillStyle='#44bb44';cx.fillRect(px-1,py-4,9,5);
    cx.fillStyle='#66dd66';cx.fillRect(px+1,py-6,5,3);
  }

  // 부서 구분선 + 간판
  const nd=S.depts.length;
  const dw=Math.floor(W/nd);
  S.depts.forEach((dept,di)=>{
    const sx=di*dw;
    // 칸막이 (첫 번째 제외)
    if(di>0){
      cx.fillStyle='#887755';cx.fillRect(sx,fy-10,2,H-fy+10);
      cx.fillStyle='#aa9966';cx.fillRect(sx+1,fy-10,1,H-fy+10);
    }
    // 부서 간판
    const label=dept.icon+' '+dept.name;
    cx.fillStyle='#5a4a30';
    cx.fillRect(sx+4,fy-10,dw-10,9);
    cx.fillStyle='#7a6a50';
    cx.fillRect(sx+5,fy-9,dw-12,7);
    cx.fillStyle='#fff';cx.font='5px monospace';cx.textAlign='center';
    cx.fillText(label,sx+dw/2,fy-4);
  });

  // 캐릭터 (부서별 배치)
  let ci=0;
  S.depts.forEach((dept,di)=>{
    dept.emps.forEach((emp,ei)=>{
      const p=charPosInDept(di,ei);
      const isWaving=waveChars[ci]!==undefined&&(aT-waveChars[ci])<2.0;
      drawChar(p.x,p.y,emp,E[emp.gi],dept.kpi,ci===clickC,isWaving);
      ci++;
    });
  });
}

function drawChar(x,y,emp,eg,kpi,bubble,isWaving){
  x=Math.round(x);y=Math.round(y);

  // 그림자
  cx.fillStyle='rgba(0,0,0,0.25)';cx.fillRect(x-3,y+1,7,2);

  // 발
  cx.fillStyle='#333';cx.fillRect(x-3,y-1,2,2);cx.fillRect(x+1,y-1,2,2);

  // 몸 (양복)
  cx.fillStyle=eg.bg;cx.fillRect(x-4,y-7,8,6);
  // 넥타이
  cx.fillStyle=eg.c;cx.fillRect(x-1,y-7,1,4);

  // 팔 - 인사할 때 오른손 위로
  cx.fillStyle=eg.bg;
  cx.fillRect(x-5,y-6,1,3); // 왼팔 고정
  if(isWaving){
    // 오른손 위로 올림 (손 흔들기)
    const wave=Math.sin(aT*10)*1;
    cx.fillRect(x+4,y-9,1,3); // 팔 위로
    cx.fillStyle=emp.skin;
    cx.fillRect(x+4,Math.round(y-10+wave),2,2); // 손 흔들기
    cx.fillStyle=emp.skin;cx.fillRect(x-5,y-3,1,1); // 왼손
  } else {
    cx.fillRect(x+4,y-6,1,3); // 오른팔 내림
    cx.fillStyle=emp.skin;cx.fillRect(x-5,y-3,1,1);cx.fillRect(x+4,y-3,1,1);
  }

  // 머리
  cx.fillStyle=emp.skin;cx.fillRect(x-3,y-13,7,6);
  // 머리카락
  cx.fillStyle=emp.hair;cx.fillRect(x-3,y-15,8,3);cx.fillRect(x-4,y-14,1,3);cx.fillRect(x+5,y-14,1,3);

  // 눈
  if(isWaving){
    // 웃는 눈 (^ ^)
    cx.fillStyle='#222';
    cx.fillRect(x-2,y-11,2,1);cx.fillRect(x-3,y-12,1,1);cx.fillRect(x,y-12,1,1);
    cx.fillRect(x+1,y-11,2,1);cx.fillRect(x+1,y-12,1,1);cx.fillRect(x+3,y-12,1,1);
    // 웃는 입
    cx.fillStyle='#cc7766';cx.fillRect(x-1,y-8,3,1);cx.fillRect(x-2,y-9,1,1);cx.fillRect(x+2,y-9,1,1);
  } else if(emp.mood==='bad'){
    cx.fillStyle='#888';cx.fillRect(x-2,y-11,1,1);cx.fillRect(x+2,y-11,1,1);
    cx.fillStyle='#aa7777';cx.fillRect(x-1,y-9,3,1);
  } else {
    cx.fillStyle='#222';cx.fillRect(x-2,y-11,2,2);cx.fillRect(x+1,y-11,2,2);
    cx.fillStyle='#fff';cx.fillRect(x-2,y-11,1,1);cx.fillRect(x+1,y-11,1,1);
    if(emp.mood==='great'||emp.mood==='good'){
      cx.fillStyle='#cc7766';cx.fillRect(x-1,y-8,3,1);
    }
  }

  // 무드 아이콘 (가만히)
  if(!isWaving){
    if(emp.mood==='great'){
      cx.fillStyle='#ffcc00';
      cx.fillRect(x+5,y-17,2,2);cx.fillRect(x+6,y-18,1,1);cx.fillRect(x+6,y-15,1,1);
    } else if(emp.mood==='bad'){
      cx.fillStyle='#6688ff';cx.fillRect(x+5,y-16,1,2);
    }
  }

  // 이름
  cx.fillStyle='rgba(0,0,0,0.75)';cx.fillRect(x-10,y+3,20,6);
  cx.fillStyle='#fff';cx.font='5px monospace';cx.textAlign='center';
  cx.fillText(emp.name,x,y+8);

  // 직급
  cx.fillStyle=eg.bg;cx.fillRect(x-6,y+9,13,6);
  cx.fillStyle='#fff';cx.font='4px monospace';
  cx.fillText(eg.rank,x,y+13);

  // 말풍선 (클릭 시, 크게)
  if(bubble){
    const msg=kpi>=50?rnd(['화이팅!','최고!','열심히!','좋아요!']):rnd(['힘들어..','ㅠㅠ','사직서..','CEO님..']);
    const bw=msg.length*5+10,bx=x-bw/2,by=y-28;
    // 배경
    cx.fillStyle='#fffde0';cx.fillRect(bx,by,bw,12);
    // 테두리
    cx.fillStyle='#5a4a30';
    cx.fillRect(bx,by,bw,2);cx.fillRect(bx,by+10,bw,2);
    cx.fillRect(bx,by,2,12);cx.fillRect(bx+bw-2,by,2,12);
    // 꼬리
    cx.fillStyle='#fffde0';cx.fillRect(x-2,by+12,4,3);
    cx.fillStyle='#5a4a30';cx.fillRect(x-2,by+13,1,2);cx.fillRect(x+2,by+13,1,2);
    // 텍스트 (굵게, 크게)
    cx.fillStyle='#3a2a10';cx.font='bold 7px monospace';cx.textAlign='center';
    cx.fillText(msg,x,by+9);
  }
}

// ===== TABS =====
function switchTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('active',['missions','employees','report'][i]===t);});
  renderContent();
}

function renderContent(){
  const c=document.getElementById('content');
  if(S.tab==='missions')renderMissions(c);
  else if(S.tab==='employees')renderEmployees(c);
  else renderReport(c);
}

function renderMissions(c){
  let h='';
  S.depts.forEach((d,di)=>{
    const kc=d.kpi>=70?'high':d.kpi>=40?'mid':'low';
    h+=`<div class="rc"><div class="rc-head"><div class="rc-title">${d.icon} ${d.name}</div><div class="rc-badge ${kc}">${d.kpi}%</div></div><div class="rc-body"><div class="kbar"><div class="kbar-fill ${kc}" style="width:${d.kpi}%"></div></div>`;
    d.missions.forEach((m,mi)=>{
      const cls=m.st==='done'?'done':m.st==='fail'?'fail':'';
      const ck=m.st==='done'?'✓':m.st==='fail'?'✕':'';
      const act=m.st==='todo'?`onclick="doM(${di},${mi})"`:m.st==='fail'?`onclick="retry(${di},${mi})"`:''
      h+=`<div class="mi ${cls}" ${act}><div class="mi-ck">${ck}</div><div class="mi-txt">${m.text}</div></div>`;
    });
    h+=`</div></div>`;
  });
  if(S.depts.length<G[S.gi].maxDept) h+=`<div class="add-c" onclick="addDept()">+ 새 부서 설립</div>`;
  c.innerHTML=h;
}

function renderEmployees(c){
  let h='';
  S.depts.forEach((d,di)=>{
    h+=`<div class="rc"><div class="rc-head"><div class="rc-title">${d.icon} ${d.name}</div><div style="font-size:8px;color:#66cc44;cursor:pointer" onclick="openSheet(${di})">+ 채용</div></div><div class="rc-body">`;
    d.emps.forEach(emp=>{
      const g=E[emp.gi];
      const m=emp.mood==='great'?'★':emp.mood==='good'?'♪':emp.mood==='bad'?'✕':'·';
      h+=`<div class="er"><div class="er-face" style="background:${g.bg};border-color:${g.c}">${m}</div><div class="er-info"><div class="n">${emp.name}</div><div class="r" style="color:${g.c}">${g.rank} · KPI +${g.bonus}%</div></div></div>`;
    });
    h+=`</div></div>`;
  });
  c.innerHTML=h;
}

function renderReport(c){
  const avg=S.depts.length?Math.round(S.depts.reduce((s,d)=>s+d.kpi,0)/S.depts.length):0;
  const tot=S.depts.reduce((s,d)=>s+d.emps.length,0);
  const g=G[S.gi];

  let dr=S.depts.map(d=>{
    const kc=d.kpi>=70?'high':d.kpi>=40?'mid':'low';
    const color=d.kpi>=70?'#44aa22':d.kpi>=40?'#ccaa00':'#aa2222';
    return `<div class="rpt-dept">
      <span>${d.icon} ${d.name}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="rpt-bar-mini"><div class="rpt-bar-fill" style="width:${d.kpi}%;background:${color};height:100%"></div></div>
        <span style="color:${color};font-weight:bold;min-width:28px;text-align:right">${d.kpi}%</span>
      </div>
    </div>`;
  }).join('');

  c.innerHTML=`<div class="rc">
    <div class="rc-body">
      <div class="rpt-header">
        <div class="icon">${g.icon}</div>
        <div class="grade">${g.name}</div>
        <div class="sub">LV.${S.lv} · DAY ${String(S.day).padStart(3,'0')}</div>
      </div>
      <div class="rpt-stats">
        <div class="rpt-stat"><div class="v" style="color:${avg>=70?'#66ff66':avg>=40?'#ffcc00':'#ff6666'}">${avg}%</div><div class="l">평균 KPI</div></div>
        <div class="rpt-stat"><div class="v" style="color:#88ccff">${tot}명</div><div class="l">총 직원</div></div>
        <div class="rpt-stat"><div class="v" style="color:#66cc44">${(S.money/1000).toFixed(0)}K</div><div class="l">보유 자금</div></div>
      </div>
      <div style="font-size:9px;color:#a09870;padding:4px 0;border-bottom:2px solid #5a5530;margin-bottom:4px">▸ 부서별 성과</div>
      ${dr}
      <div class="rpt-next">
        <div>다음 목표</div>
        <div class="target">${S.gi<5?G[S.gi+1].icon+' '+G[S.gi+1].name:'🏆 최고 등급!'}</div>
        <div style="margin-top:4px">EXP ${S.exp} / ${g.exp}</div>
        <div class="kbar" style="margin-top:4px;margin-bottom:0"><div class="kbar-fill" style="width:${Math.min(100,S.exp/g.exp*100)}%;background:#66cc44"></div></div>
      </div>
    </div>
  </div>`;
}

// ===== ACTIONS =====
function doM(di,mi){
  const d=S.depts[di];if(d.missions[mi].st!=='todo')return;
  d.missions[mi].st='done';
  const bonus=d.emps.reduce((s,e)=>s+E[e.gi].bonus,0);
  const gain=Math.min(18,8+Math.floor(bonus/4));
  d.kpi=Math.min(100,d.kpi+gain);
  S.exp+=10+Math.floor(bonus/3);S.money+=500;
  d.emps.forEach(e=>{e.mood=d.kpi>=70?'great':d.kpi>=50?'good':'normal';});
  toast(`✓ ${d.missions[mi].text} +${gain}%`);
  checkUp();updateLuna();renderContent();
}
function retry(di,mi){S.depts[di].missions[mi].st='todo';renderContent();}

function newDay(){
  S.day++;
  S.depts.forEach(d=>{
    d.missions.forEach(m=>{if(m.st==='todo')m.st='fail';});
    const f=d.missions.filter(m=>m.st==='fail').length;
    if(f)d.kpi=Math.max(0,d.kpi-f*6);
    d.kpi=Math.max(0,d.kpi-2);
    d.emps.forEach(e=>{e.mood=d.kpi<30?'bad':d.kpi<50?'normal':e.mood;});
    const t=D.find(x=>x.id===d.id);
    d.missions=t.ms.map(m=>({text:m,st:'todo'}));
  });
  checkDown();updateLuna();toast(`DAY ${String(S.day).padStart(3,'0')}`);render();
}

function addDept(){
  if(S.depts.length>=G[S.gi].maxDept)return toast('등급 부족',true);
  const t=D[S.depts.length];if(!t)return;
  S.depts.push({...t,kpi:50,emps:[mkEmp(0)],missions:t.ms.map(m=>({text:m,st:'todo'}))});
  toast(`🏢 ${t.name} 설립!`);render();
}

function checkUp(){const g=G[S.gi];if(S.exp>=g.exp&&S.gi<5){S.exp-=g.exp;S.gi++;S.lv++;toast(`★ ${G[S.gi].name} 승급!`);}}
function checkDown(){if(S.gi<=0)return;const avg=S.depts.reduce((s,d)=>s+d.kpi,0)/S.depts.length;if(avg<G[S.gi-1].minKpi){S.gi--;S.lv=Math.max(1,S.lv-1);toast(`${G[S.gi].name} 강등..`,true);}}

// ===== HIRE =====
let hDi=0;
function openSheet(di){
  hDi=di;
  document.getElementById('shTitle').textContent=S.depts[di].name+' 채용';
  const b=document.getElementById('shBody');
  b.innerHTML=E.map((g,gi)=>{
    const lk=gi>S.gi+2,br=g.cost>S.money,dis=lk||br;
    return `<div class="hr ${dis?'locked':''}" onclick="${dis?'':'hire('+gi+')'}">
      <div class="hr-ic" style="background:${g.bg};border-color:${g.c}">★</div>
      <div class="hr-info"><div class="t" style="color:${g.c}">${g.rank}</div>
      <div class="d">${lk?'🔒 등급 부족':br?'💸 자금 부족':'KPI +'+g.bonus+'%'}</div></div>
      <div class="hr-cost">${g.cost?g.cost.toLocaleString()+'원':'무료'}</div>
    </div>`;
  }).join('');
  document.getElementById('shBg').classList.add('open');
}
function openSheetAll(){if(S.depts.length)openSheet(0);}
function closeSheet(){document.getElementById('shBg').classList.remove('open');}
function hire(gi){
  const g=E[gi];if(g.cost>S.money)return;
  S.money-=g.cost;
  S.depts[hDi].emps.push(mkEmp(gi));
  toast(`${S.depts[hDi].emps.at(-1).name} ${g.rank} 채용!`);closeSheet();render();
}

// ===== LUNA =====
function updateLuna(){
  const avg=S.depts.length?Math.round(S.depts.reduce((s,d)=>s+d.kpi,0)/S.depts.length):0;
  const todo=S.depts.reduce((s,d)=>s+d.missions.filter(m=>m.st==='todo').length,0);
  let m='';
  if(avg>=80)m='전부서 순항! 승급 가까워요 ★';
  else if(avg>=60)m='양호합니다. 조금만 더!';
  else if(avg>=40)m='KPI 불안.. 미션 확인!';
  else m='긴급! 직원들 동요중..';
  if(todo)m+=` (남은:${todo}건)`;
  document.getElementById('lunaMsg').textContent=m;
}

function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.style.display='block';setTimeout(()=>t.style.display='none',2000);}

function render(){
  const g=G[S.gi];
  document.getElementById('hudDay').textContent=`DAY ${String(S.day).padStart(3,'0')}`;
  document.getElementById('hudGrade').textContent=`${g.icon} ${g.name}`;
  document.getElementById('expBar').style.width=Math.min(100,S.exp/g.exp*100)+'%';
  const avg=S.depts.length?Math.round(S.depts.reduce((s,d)=>s+d.kpi,0)/S.depts.length):0;
  document.getElementById('hudKpi').textContent=avg+'%';
  document.getElementById('hudKpi').style.color=avg>=70?'#66ff66':avg>=40?'#ffcc00':'#ff6666';
  document.getElementById('hudEmp').textContent=S.depts.reduce((s,d)=>s+d.emps.length,0);
  document.getElementById('hudMoney').textContent=(S.money/1000).toFixed(0)+'K';
  renderContent();updateLuna();
}

function resetGame(){if(!confirm('리셋?'))return;S={money:50000,exp:0,lv:1,gi:0,day:1,depts:[],used:[],tab:'missions'};init();}

init();
</script>
