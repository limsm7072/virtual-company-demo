<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수호컴퍼니</title>
<style>
  @font-face{font-family:'Dot';src:url('https://fonts.gstatic.com/s/dotgothic16/v17/v6-QGYjBJFKgyw5nSoDAGE7L435YPFrT.woff2') format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Dot','DotGothic16',monospace;background:#0a0a1a;color:#f0e8d0;overflow-x:hidden;max-width:480px;margin:0 auto;border-left:2px solid #4a4a2a;border-right:2px solid #4a4a2a;min-height:100vh}

  .hud{background:#3a3520;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #5a5530;position:sticky;top:0;z-index:50}
  .hud-left{display:flex;flex-direction:column;gap:1px}
  .hud-day{font-size:9px;color:#a09870}
  .hud-grade{font-size:11px;color:#ffe066;text-shadow:1px 1px 0 #806000}
  .hud-right{display:flex;gap:8px}
  .hud-stat{text-align:center;background:#2a2510;padding:4px 8px;border:2px solid #5a5530}
  .hud-stat .val{font-size:11px;font-weight:bold}
  .hud-stat .lbl{font-size:7px;color:#8a8060}

  .office-wrap{position:relative;width:100%;height:260px;background:#1a1a10;border-bottom:3px solid #5a5530;overflow:hidden}
  .office-canvas{width:100%;height:100%;display:block;image-rendering:pixelated}

  .content{padding:8px;padding-bottom:60px}

  .card{background:#3a3520;border:2px solid #5a5530;margin-bottom:8px;box-shadow:2px 2px 0 rgba(0,0,0,0.4)}
  .card-head{background:#4a4520;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #5a5530}
  .card-title{font-size:11px;color:#f0e8d0}
  .card-body{padding:8px}

  .btn{display:flex;align-items:center;gap:8px;padding:8px;background:#2a2510;border:2px solid #5a5530;margin-bottom:4px;cursor:pointer;transition:all 0.1s}
  .btn:active{background:#4a4520;transform:scale(0.97)}
  .btn .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid;flex-shrink:0}
  .btn .info{flex:1}
  .btn .info .t{font-size:10px;font-weight:bold}
  .btn .info .d{font-size:8px;color:#8a8060}
  .btn .cost{font-size:9px;font-weight:bold}
  .btn.locked{opacity:0.3;pointer-events:none}

  .mi{display:flex;align-items:center;gap:8px;padding:8px;background:#2a2510;border:1px solid #4a4520;margin-bottom:4px;cursor:pointer}
  .mi:active{background:#4a4520;transform:scale(0.97)}
  .mi-ck{width:14px;height:14px;border:2px solid #5a5530;background:#1a1a10;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
  .mi.done .mi-ck{background:#228822;border-color:#44cc44;color:#fff}
  .mi .mi-txt{font-size:10px;flex:1}
  .mi.done .mi-txt{color:#6a6a4a;text-decoration:line-through}

  .prog-wrap{background:#1a1a10;border:2px solid #5a5530;height:14px;margin:6px 0;position:relative;overflow:hidden}
  .prog-fill{height:100%;background:#66aa44;transition:width 0.3s}
  .prog-text{position:absolute;top:0;left:0;width:100%;text-align:center;font-size:8px;line-height:10px;color:#fff}

  .bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;background:#3a3520;border-top:3px solid #5a5530;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:4px}
  .bb{flex:1;padding:8px 0;border:2px solid;font-family:inherit;font-size:9px;cursor:pointer;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,0.3)}
  .bb:active{transform:translate(1px,1px)}
  .bb.pri{background:#4a6a2a;border-color:#66aa44;color:#ccff88}
  .bb.sec{background:#2a2510;border-color:#5a5530;color:#a09870}
  .bb.hide{display:none}

  .toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:200;background:#3a3520;border:2px solid #66cc44;color:#ccff88;padding:6px 14px;font-size:9px;display:none;box-shadow:2px 2px 0 rgba(0,0,0,0.5);font-family:inherit}
  .toast.bad{border-color:#cc4444;color:#ff8888}

  .sh-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100}
  .sh-bg.open{display:block}
  .sh{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:65vh;overflow-y:auto;background:#3a3520;border:2px solid #5a5530;border-bottom:none;padding:12px 8px;z-index:101;transition:transform 0.3s}
  .sh-bg.open .sh{transform:translateX(-50%) translateY(0)}
  .sh h3{font-size:11px;color:#ffe066;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #5a5530}

  /* 인트로 */
  .intro{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;background:#1a1a10;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:480px;margin:0 auto}
  .intro.hidden{display:none}
  .intro-title{text-align:center;margin-bottom:40px}
  .intro-title .logo{font-size:48px;margin-bottom:12px}
  .intro-title h1{font-size:18px;color:#ffe066;text-shadow:2px 2px 0 #806000;letter-spacing:2px}
  .intro-title .sub{font-size:9px;color:#8a8060;margin-top:6px}
  .intro-start{padding:12px 40px;background:#4a6a2a;border:2px solid #66aa44;color:#ccff88;font-family:inherit;font-size:12px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,0.4);animation:pulse 1.5s ease-in-out infinite}
  .intro-start:active{transform:translate(1px,1px)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}

  .npc-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;background:#1a1a10;max-width:480px;margin:0 auto;display:none;flex-direction:column}
  .npc-screen.active{display:flex}
  .npc-scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .npc-luna{width:80px;height:80px;background:linear-gradient(135deg,#4a6a2a,#66aa44);border:3px solid #3a5520;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;box-shadow:3px 3px 0 rgba(0,0,0,0.4)}
  .npc-name{font-size:11px;color:#ffe066;margin-bottom:20px}
  .npc-dialog{width:100%;background:#3a3520;border:2px solid #5a5530;padding:16px;box-shadow:2px 2px 0 rgba(0,0,0,0.4);min-height:80px}
  .npc-text{font-size:11px;color:#f0e8d0;line-height:1.6;white-space:pre-line}
  .npc-tap{font-size:8px;color:#8a8060;text-align:right;margin-top:8px;animation:pulse 1.2s ease-in-out infinite}
  .npc-input{width:100%;padding:10px;background:#2a2510;border:2px solid #5a5530;color:#ffe066;font-family:inherit;font-size:13px;text-align:center;margin-top:12px}
  .npc-confirm{margin-top:12px;padding:10px 30px;background:#4a6a2a;border:2px solid #66aa44;color:#ccff88;font-family:inherit;font-size:11px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,0.4)}
  .hr{display:flex;align-items:center;gap:8px;padding:8px 6px;background:#2a2510;border:2px solid #4a4520;margin-bottom:4px;cursor:pointer}
  .hr:active{background:#4a4520}
  .hr.locked{opacity:0.3;pointer-events:none}
  .hr-info{flex:1}.hr-info .t{font-size:10px;font-weight:bold}.hr-info .d{font-size:8px;color:#8a8060}
  .hr-cost{font-size:9px;color:#66cc44;font-weight:bold}
  .hr-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid}
</style>
</head>
<body>

<div class="intro" id="introScreen">
  <div class="intro-title">
    <div class="logo">🏢</div>
    <h1>수호 컴퍼니</h1>
    <div class="sub">나만의 회사를 세우고 성장시키세요</div>
  </div>
  <button class="intro-start" onclick="startIntro()">▸ 시작하기</button>
</div>

<div class="npc-screen" id="npcScreen">
  <div class="npc-scene" id="npcScene">
    <div class="npc-luna" id="npcAvatar">🏢</div>
    <div class="npc-name" id="npcNameEl"></div>
    <div class="npc-dialog" id="npcDialog" onclick="nextDialog()">
      <div class="npc-text" id="npcText"></div>
      <div class="npc-tap" id="npcTap">탭하여 계속 ▸</div>
    </div>
    <div id="npcExtra" style="width:100%;text-align:center"></div>
  </div>
</div>

<div id="gameScreen" style="display:none">
<div class="hud">
  <div class="hud-left">
    <div class="hud-day" id="hudDay"></div>
    <div class="hud-grade" id="hudGrade">수호컴퍼니</div>
  </div>
  <div class="hud-right">
    <div class="hud-stat"><div class="val" id="hudMoney" style="color:#66cc44">0</div><div class="lbl">자금</div></div>
  </div>
</div>

<div class="office-wrap" id="officeWrap">
  <canvas class="office-canvas" id="canvas"></canvas>
</div>

<div class="content" id="content"></div>

<div class="sh-bg" id="shBg" onclick="closeSheet()">
  <div class="sh" onclick="event.stopPropagation()">
    <h3>▸ <span id="shTitle"></span></h3>
    <div id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="bbar">
  <button class="bb pri" onclick="nextDay()">📅 다음 날</button>
</div>
</div>

<script>
// ===== 제작 가능 기능 목록 =====
const CRAFTS=[
  // 인턴(0)이 만들 수 있는 것
  {id:'routine_add',name:'루틴 등록 기능',desc:'루틴을 추가할 수 있게 됩니다',time:10,reward:500,icon:'📋',req:[],minRank:0},
  {id:'routine_check',name:'루틴 체크 기능',desc:'루틴 달성을 체크할 수 있습니다',time:15,reward:500,icon:'✅',req:['routine_add'],minRank:0},
  {id:'hire_system',name:'채용 시스템',desc:'새 직원을 채용할 수 있습니다',time:25,reward:1000,icon:'👔',req:['routine_check'],minRank:0},
  // 사원(1) 이상
  {id:'kpi_bar',name:'KPI 표시',desc:'성과를 수치로 확인합니다',time:20,reward:800,icon:'📊',req:['routine_check'],minRank:1},
  {id:'notify',name:'알림 기능',desc:'루틴 알림을 보내줍니다',time:30,reward:1000,icon:'🔔',req:['routine_check'],minRank:1},
  {id:'new_team',name:'팀 확장',desc:'새 팀을 추가할 수 있습니다',time:40,reward:1500,icon:'🏢',req:['hire_system'],minRank:1},
  // 대리(2) 이상
  {id:'auto_prod',name:'자동 생산',desc:'직원이 자동으로 수익을 생산합니다',time:50,reward:2000,icon:'⚡',req:['kpi_bar'],minRank:2},
  {id:'stats',name:'통계 리포트',desc:'상세 통계를 볼 수 있습니다',time:40,reward:1500,icon:'📈',req:['kpi_bar'],minRank:2},
  // 과장(3) 이상
  {id:'biz_tab',name:'사업 수주',desc:'사업을 수주받아 큰 돈을 법니다',time:60,reward:3000,icon:'💼',req:['new_team'],minRank:3},
  {id:'overlay',name:'오버레이 알림',desc:'화면 위에 캐릭터가 나타나 독촉',time:50,reward:2500,icon:'💬',req:['notify'],minRank:3},
  // 부장(4) 이상
  {id:'ai_coach',name:'AI 코칭',desc:'패턴 분석 + 맞춤 루틴 제안',time:80,reward:5000,icon:'🤖',req:['stats','auto_prod'],minRank:4},
  // 임원(5)
  {id:'full_auto',name:'풀 자동화',desc:'자율 에이전트, 선제적 실행',time:120,reward:10000,icon:'🚀',req:['ai_coach','overlay'],minRank:5},
];

const E=[
  {rank:'인턴',c:'#88aaaa',bg:'#556666',cost:2000,bonus:0,speed:1,skill:'기본 알림',desc:'정해진 시간에 알림만'},
  {rank:'사원',c:'#66aaee',bg:'#336699',cost:3500,bonus:5,speed:1.5,skill:'API 연동',desc:'캘린더/건강앱 데이터 연동'},
  {rank:'대리',c:'#66cc66',bg:'#338833',cost:5900,bonus:10,speed:2,skill:'OS 제어',desc:'방해금지/알람 자동 설정'},
  {rank:'과장',c:'#eeaa44',bg:'#aa6600',cost:8900,bonus:15,speed:2.5,skill:'오버레이 잔소리',desc:'화면 위 캐릭터가 독촉'},
  {rank:'부장',c:'#cc88ee',bg:'#774499',cost:12900,bonus:20,speed:3,skill:'AI 분석',desc:'패턴 분석 + 맞춤 루틴'},
  {rank:'임원',c:'#ee6666',bg:'#993333',cost:19900,bonus:30,speed:4,skill:'풀 자동화',desc:'자율 에이전트'},
];

const DEPT_TEMPLATES=[
  {id:'exercise',name:'운동팀',icon:'💪'},
  {id:'sleep',name:'수면팀',icon:'😴'},
  {id:'study',name:'학습팀',icon:'📚'},
  {id:'health',name:'건강팀',icon:'🥗'},
  {id:'finance',name:'재정팀',icon:'💰'},
  {id:'mental',name:'멘탈팀',icon:'🧘'},
];

const NAMES=['김수호','이하늘','박지민','최윤서','정다은','강민준','조서연','윤태호','한소율','임재현','송예린','오동현'];
const SK=['#FFDBB4','#E8B88A','#D4A574','#C68642'];
const HR=['#222','#4A2800','#8B4513','#333'];
const SHOP=[
  {id:'plant1',name:'작은 화분',desc:'사무실이 조금 밝아집니다',cost:500,icon:'🪴',type:'deco'},
  {id:'poster',name:'동기부여 포스터',desc:'"Just Do It" 직원 사기 +',cost:800,icon:'🖼️',type:'deco'},
  {id:'coffee',name:'커피 머신',desc:'직원 제작 속도 10% 증가',cost:2000,icon:'☕',type:'buff',effect:'speed_10'},
  {id:'snack',name:'간식 바구니',desc:'직원 사기 향상',cost:1000,icon:'🍪',type:'buff',effect:'morale'},
  {id:'monitor',name:'모니터 업그레이드',desc:'제작 속도 20% 증가',cost:5000,icon:'🖥️',type:'buff',effect:'speed_20'},
  {id:'chair',name:'고급 의자',desc:'직원 만족도 향상',cost:3000,icon:'🪑',type:'deco'},
  {id:'gem_small',name:'💎 소형 보석 (현질)',desc:'즉시 5,000원 획득',cost:'₩1,200',icon:'💎',type:'iap',give:5000},
  {id:'gem_big',name:'💎 대형 보석 (현질)',desc:'즉시 20,000원 획득',cost:'₩4,900',icon:'💎',type:'iap',give:20000},
];

const rnd=a=>a[Math.floor(Math.random()*a.length)];

let S={
  money:0,day:1,founded:false,companyName:'',
  depts:[],emps:[],used:[],
  unlocked:[],
  crafting:null,
  missions:[],
  owned:[], // {id, x, y} 배치된 아이템
  speedBonus:1,
};
let placingItem=null; // 배치 모드 중인 아이템

function rN(){const a=NAMES.filter(n=>!S.used.includes(n));const n=a.length?rnd(a):rnd(NAMES);S.used.push(n);return n;}
function mkEmp(gi){return{name:rN(),gi,skin:rnd(SK),hair:rnd(HR),state:'idle',mood:'normal'};}
function has(id){return S.unlocked.includes(id);}
function hasItem(id){return S.owned.some(o=>o.id===id);}

// ===== 인트로 =====
let introStep=0;
const STORIES=[
  {icon:'💼',msg:'당신은 오늘,\n모든 것을 바꾸기로 결심했습니다.'},
  {icon:'📊',msg:'운동, 수면, 공부, 건강...\n혼자서는 관리가 안 되는 것들.'},
  {icon:'🏢',msg:'그래서 생각했습니다.\n\n"회사를 만들자.\n나를 관리해줄 회사를."'},
  {icon:'👔',msg:'직원을 뽑고, 팀을 꾸리고\n그들이 기능을 하나씩\n만들어줄 겁니다.'},
  {icon:'🚀',msg:'처음엔 아무 기능도 없습니다.\n직원이 일해야 기능이 생깁니다.\n\n준비 되셨나요?'},
];

function startIntro(){
  document.getElementById('introScreen').classList.add('hidden');
  document.getElementById('npcScreen').classList.add('active');
  introStep=0;showIntroStep();
}

function showIntroStep(){
  const av=document.getElementById('npcAvatar');
  const nm=document.getElementById('npcNameEl');
  const tx=document.getElementById('npcText');
  const tp=document.getElementById('npcTap');
  const ex=document.getElementById('npcExtra');
  const dg=document.getElementById('npcDialog');

  if(introStep<STORIES.length){
    av.textContent=STORIES[introStep].icon;nm.textContent='';
    tx.textContent=STORIES[introStep].msg;
    tp.style.display='block';tp.textContent='탭하여 계속 ▸';
    dg.onclick=()=>{introStep++;showIntroStep();};
    ex.innerHTML='';
  } else if(introStep===STORIES.length){
    // 회사 이름
    av.textContent='🏢';nm.textContent='';
    tx.textContent='모든 회사에는 이름이 필요합니다.\n\n당신의 회사, 뭐라고 부를까요?';
    tp.style.display='none';dg.onclick=null;
    ex.innerHTML=`<input class="npc-input" id="nameInput" placeholder="회사 이름" maxlength="10"><br><button class="npc-confirm" onclick="introSetName()">▸ 다음</button>`;
    setTimeout(()=>{const i=document.getElementById('nameInput');if(i)i.focus();},300);
  } else if(introStep===STORIES.length+1){
    // 투자
    av.textContent='💰';nm.textContent='';
    S.money=8000;
    tx.textContent=`${S.companyName}\n\n시드 투자금 8,000원이\n입금되었습니다.\n\n사무실을 임대하세요.`;
    tp.style.display='block';tp.textContent='탭하여 계속 ▸';
    dg.onclick=()=>{introStep++;showIntroStep();};
    ex.innerHTML='';
  } else if(introStep===STORIES.length+2){
    // 사무실
    av.textContent='🏠';nm.textContent='';
    tx.textContent='사무실을 선택하세요.';
    tp.style.display='none';dg.onclick=null;
    const afford=5000<=S.money;
    ex.innerHTML=`<div style="margin-top:8px">
      <div class="hr ${afford?'':'locked'}" onclick="${afford?'introRentOffice()':''}">
        <div class="hr-ic" style="background:#4a4520;border-color:#8a8060;font-size:16px">🏠</div>
        <div class="hr-info"><div class="t" style="color:#ffe066">원룸 사무실</div><div class="d">책상 2개, 좁지만 시작하기 좋은</div></div>
        <div class="hr-cost">5,000원</div>
      </div>
      <div class="hr locked"><div class="hr-ic" style="background:#4a4520;border-color:#5a5530;font-size:16px">🏢</div><div class="hr-info"><div class="t" style="color:#5a5530">공유 오피스</div><div class="d">🔒 자금 부족</div></div><div class="hr-cost" style="color:#ff6666">15,000원</div></div>
    </div><div style="font-size:9px;color:#8a8060;margin-top:6px">보유: <span style="color:#66cc44">${S.money.toLocaleString()}원</span></div>`;
  } else if(introStep===STORIES.length+3){
    // 첫 직원 채용
    av.textContent='👔';nm.textContent='';
    tx.textContent='사무실이 생겼습니다!\n\n이제 첫 직원을 채용하세요.\n직원이 있어야 일이 시작됩니다.';
    tp.style.display='none';dg.onclick=null;
    const afford=E[0].cost<=S.money;
    ex.innerHTML=`<div style="margin-top:8px">
      <div class="hr ${afford?'':'locked'}" onclick="${afford?'introHire(0)':''}">
        <div class="hr-ic" style="background:${E[0].bg};border-color:${E[0].c};font-size:12px">★</div>
        <div class="hr-info"><div class="t" style="color:${E[0].c}">${E[0].rank}</div><div class="d">${E[0].skill} · ${E[0].desc}</div></div>
        <div class="hr-cost">${E[0].cost.toLocaleString()}원</div>
      </div>
    </div><div style="font-size:9px;color:#8a8060;margin-top:6px">보유: <span style="color:#66cc44">${S.money.toLocaleString()}원</span></div>`;
  } else if(introStep===STORIES.length+4){
    // 완료
    av.textContent='🎉';nm.textContent='';
    tx.textContent=`${S.companyName} 개업 준비 완료!\n\n${S.emps[0].name} ${E[S.emps[0].gi].rank}이\n대기하고 있습니다.\n\n클릭해서 일을 시키세요!`;
    tp.style.display='block';tp.textContent='▸ 시작';
    dg.onclick=()=>{
      document.getElementById('npcScreen').classList.remove('active');
      document.getElementById('gameScreen').style.display='block';
      S.founded=true;setupCanvas();renderAll();requestAnimationFrame(gameLoop);
      toast(`🏢 ${S.companyName} 개업!`);
    };

  }
}

function introSetName(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v)return;
  S.companyName=v;introStep++;showIntroStep();
}
function introRentOffice(){
  S.money-=5000;introStep++;showIntroStep();
}
function introHire(gi){
  if(E[gi].cost>S.money)return;
  S.money-=E[gi].cost;
  S.emps.push(mkEmp(gi));
  introStep++;showIntroStep();
}

// ===== 캔버스 =====
let cv,cx,W,H,PX=3,aT=0;

function setupCanvas(){
  cv=document.getElementById('canvas');
  const r=cv.parentElement.getBoundingClientRect();
  W=Math.floor(r.width/PX);H=Math.floor(r.height/PX);
  cv.width=W;cv.height=H;cv.style.imageRendering='pixelated';
  cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
  cv.onclick=onCanvasClick;
}

function onCanvasClick(e){
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/PX,my=(e.clientY-r.top)/PX;

  // 배치 모드
  if(placingItem){
    S.owned.push({id:placingItem.id,x:Math.round(mx),y:Math.round(my)});
    toast(`✅ ${placingItem.name} 배치 완료!`);
    placingItem=null;
    renderAll();
    return;
  }

  // 직원 클릭
  S.emps.forEach((emp,i)=>{
    const p=empPos(i);
    if(mx>=p.x-10&&mx<=p.x+10&&my>=p.y-20&&my<=p.y+5){
      onEmpClick(i);
    }
  });
}

function empPos(i){
  const deskX=15+i*30,deskY=Math.floor(H*0.55)+10;
  if(S.emps[i].state==='working'){
    return{x:deskX,y:deskY}; // 책상에 앉아있음
  }
  return{x:deskX, y:Math.floor(H*0.55)-4}; // 책상 앞에 서있음
}

function gameLoop(ts){
  aT=ts/1000;
  updateCrafting();
  drawOffice();
  requestAnimationFrame(gameLoop);
}

function updateCrafting(){
  // 제작 완료 체크
  if(S.crafting){
    const elapsed=(Date.now()-S.crafting.startTime)/1000;
    if(elapsed>=S.crafting.duration){
      S.unlocked.push(S.crafting.craftId);
      const craft=CRAFTS.find(c=>c.id===S.crafting.craftId);
      S.money+=craft.reward;
      S.emps[S.crafting.empIdx].state='idle';
      toast(`✅ ${craft.name} 완성! +${craft.reward}원`);
      S.crafting=null;
      renderAll();
    }
  }

  // 자동 생산 (해금된 경우)
  if(has('auto_prod')){
    if(!S._lastAutoProd)S._lastAutoProd=Date.now();
    const now=Date.now();
    if(now-S._lastAutoProd>=3000){ // 3초마다
      let income=0;
      S.emps.forEach(emp=>{
        if(emp.state==='idle'){
          // 대기 중인 직원도 자동으로 소액 생산
          const eg=E[emp.gi];
          income+=10*eg.speed;
        }
      });
      // 루틴 완료 보너스: 완료된 루틴 수 × 배율
      const doneCount=S.missions.filter(m=>m.done).length;
      const routineBonus=doneCount*50;
      income+=routineBonus;

      income=Math.round(income*S.speedBonus);
      if(income>0){
        S.money+=income;
        S._lastAutoProd=now;
        // 자동 수익은 조용히 (토스트 안 띄움), 화면만 갱신
        document.getElementById('hudMoney').textContent=S.money.toLocaleString()+'원';
      }
    }
  }
}

function drawOffice(){
  if(!cx)return;
  const fy=Math.floor(H*0.55);

  // 벽
  cx.fillStyle='#d4c8a8';cx.fillRect(0,0,W,fy);
  cx.fillStyle='#c8bc98';
  for(let y=0;y<fy;y+=10)cx.fillRect(0,y,W,1);
  cx.fillStyle='#8B7355';cx.fillRect(0,fy-2,W,4);

  // 바닥
  cx.fillStyle='#B8864E';cx.fillRect(0,fy+2,W,H-fy);
  cx.fillStyle='#C4925A';
  for(let y=fy+2;y<H;y+=8)cx.fillRect(0,y,W,3);

  // 창문
  cx.fillStyle='#eee';cx.fillRect(8,6,18,16);
  cx.fillStyle='#88ccee';cx.fillRect(10,8,6,5);cx.fillStyle='#aaddff';cx.fillRect(18,8,6,5);
  cx.fillStyle='#77bbdd';cx.fillRect(10,15,6,5);cx.fillStyle='#99ccee';cx.fillRect(18,15,6,5);
  cx.fillStyle='#eee';cx.fillRect(16,6,2,16);cx.fillRect(8,13,18,2);

  // 구매한 아이템 배치 (유저가 놓은 좌표에)
  S.owned.forEach(o=>{
    const dx=o.x,dy=o.y;
    if(o.id==='plant1'){
      cx.fillStyle='#8B4513';cx.fillRect(dx,dy,7,5);
      cx.fillStyle='#44bb44';cx.fillRect(dx-1,dy-4,9,5);
      cx.fillStyle='#66dd66';cx.fillRect(dx+1,dy-6,5,3);
    } else if(o.id==='poster'){
      cx.fillStyle='#ddd';cx.fillRect(dx,dy,14,10);
      cx.fillStyle='#ee4444';cx.fillRect(dx+1,dy+1,12,8);
      cx.fillStyle='#fff';cx.font='3px monospace';cx.textAlign='center';cx.fillText('DO IT',dx+7,dy+6);
    } else if(o.id==='coffee'){
      cx.fillStyle='#555';cx.fillRect(dx,dy,6,6);
      cx.fillStyle='#333';cx.fillRect(dx+1,dy+1,4,4);
      cx.fillStyle='#ee8844';cx.fillRect(dx+2,dy+2,2,2);
    } else if(o.id==='snack'){
      cx.fillStyle='#aa8844';cx.fillRect(dx,dy,6,4);
      cx.fillStyle='#ee6644';cx.fillRect(dx+1,dy-2,2,3);
      cx.fillStyle='#eecc44';cx.fillRect(dx+3,dy-1,2,2);
    } else if(o.id==='chair'||o.id==='monitor'){
      // 이것들은 책상에 반영됨 (아래에서 처리)
    }
  });

  // 배치 모드 커서 표시
  if(placingItem){
    cx.fillStyle='rgba(255,224,100,0.3)';
    cx.fillRect(0,0,W,H);
    cx.fillStyle='#ffe066';cx.font='5px monospace';cx.textAlign='center';
    cx.fillText('탭해서 배치',W/2,H/2);
  }

  // 책상 (직원 수만큼 항상 표시)
  const fancyChair=hasItem('chair');
  const bigMon=hasItem('monitor');
  S.emps.forEach((emp,i)=>{
    const deskX=15+i*30,deskY=Math.floor(H*0.55)+10;
    // 의자
    cx.fillStyle=fancyChair?'#884422':'#666';cx.fillRect(deskX-4,deskY-4,9,2);
    cx.fillStyle=fancyChair?'#773311':'#555';cx.fillRect(deskX-4,deskY-2,1,5);cx.fillRect(deskX+4,deskY-2,1,5);
    cx.fillStyle=fancyChair?'#995533':'#777';cx.fillRect(deskX-4,deskY+3,9,2);
    if(fancyChair){cx.fillStyle='#cc8844';cx.fillRect(deskX-4,deskY-5,9,1);}
    // 책상
    cx.fillStyle='#A0782C';cx.fillRect(deskX-6,deskY+4,13,4);
    cx.fillStyle='#B8864E';cx.fillRect(deskX-5,deskY+5,11,2);
    cx.fillStyle='#8B6914';cx.fillRect(deskX-5,deskY+8,2,3);cx.fillRect(deskX+5,deskY+8,2,3);
    // 모니터
    if(bigMon){
      cx.fillStyle='#222';cx.fillRect(deskX-5,deskY-1,11,6);
      cx.fillStyle='#4499dd';cx.fillRect(deskX-4,deskY,9,4);
    } else {
      cx.fillStyle='#333';cx.fillRect(deskX-3,deskY+1,7,4);
      cx.fillStyle='#66ddff';cx.fillRect(deskX-2,deskY+2,5,2);
    }
  });

  // 캐릭터
  S.emps.forEach((emp,i)=>{
    const p=empPos(i);
    const eg=E[emp.gi];
    const t=aT+i*2.3;

    if(emp.state==='working'){
      // 앉아서 타이핑
      const wb=Math.sin(t*2)*0.5;
      cx.fillStyle=eg.bg;cx.fillRect(p.x-3,Math.round(p.y-4+wb),7,4);
      cx.fillStyle=eg.c;cx.fillRect(p.x,Math.round(p.y-4+wb),1,2);
      // 타이핑 손
      cx.fillStyle=eg.bg;cx.fillRect(p.x-4,p.y-3,1,3);cx.fillRect(p.x+3,p.y-3,1,3);
      const tL=Math.sin(t*8)>0?-1:0,tR=Math.sin(t*8+Math.PI)>0?-1:0;
      cx.fillStyle=emp.skin;cx.fillRect(p.x-4,p.y+tL,1,1);cx.fillRect(p.x+3,p.y+tR,1,1);
      // 머리
      const hy=Math.round(p.y-10+Math.sin(t*1.5)*0.3);
      cx.fillStyle=emp.skin;cx.fillRect(p.x-3,hy,7,6);
      cx.fillStyle=emp.hair;cx.fillRect(p.x-3,hy-2,8,3);cx.fillRect(p.x-4,hy-1,1,3);cx.fillRect(p.x+5,hy-1,1,3);
      // 눈 (모니터 보는 중, 가끔 깜빡임)
      const blink=Math.sin(t*3)>0.95;
      if(blink){cx.fillStyle='#222';cx.fillRect(p.x-2,hy+3,2,1);cx.fillRect(p.x+1,hy+3,2,1);}
      else{cx.fillStyle='#222';cx.fillRect(p.x-2,hy+2,2,2);cx.fillRect(p.x+1,hy+2,2,2);cx.fillStyle='#fff';cx.fillRect(p.x-2,hy+2,1,1);cx.fillRect(p.x+1,hy+2,1,1);}
      // 타이핑 이펙트
      if(Math.sin(t*6)>0.3){cx.fillStyle='rgba(255,255,100,0.4)';cx.fillRect(p.x-2+Math.round(Math.sin(t*12)*2),p.y+3,1,1);}
      // 프로그래스 (제작 중이면)
      if(S.crafting&&S.crafting.empIdx===i){
        const pct=Math.min(1,(Date.now()-S.crafting.startTime)/1000/S.crafting.duration);
        cx.fillStyle='#1a1a10';cx.fillRect(p.x-8,p.y-15,16,3);
        cx.fillStyle='#66aa44';cx.fillRect(p.x-8,p.y-15,Math.round(16*pct),3);
        cx.fillStyle='#ffe066';cx.fillRect(p.x-8+Math.round(16*pct)-1,p.y-15,1,3);
      }
    } else {
      // 서있는 상태
      const idle=Math.sin(t*0.8)*0.5;
      // 그림자
      cx.fillStyle='rgba(0,0,0,0.2)';cx.fillRect(p.x-3,p.y+1,7,2);
      // 발
      cx.fillStyle='#333';cx.fillRect(p.x-3,p.y-1,2,2);cx.fillRect(p.x+1,p.y-1,2,2);
      // 몸
      cx.fillStyle=eg.bg;cx.fillRect(p.x-3,Math.round(p.y-7+idle),7,6);
      cx.fillStyle=eg.c;cx.fillRect(p.x,Math.round(p.y-7+idle),1,3);
      // 팔
      cx.fillStyle=eg.bg;cx.fillRect(p.x-4,Math.round(p.y-6+idle),1,4);cx.fillRect(p.x+4,Math.round(p.y-6+idle),1,4);
      cx.fillStyle=emp.skin;cx.fillRect(p.x-4,Math.round(p.y-2+idle),1,1);cx.fillRect(p.x+4,Math.round(p.y-2+idle),1,1);
      // 머리
      const hy=Math.round(p.y-13+idle);
      cx.fillStyle=emp.skin;cx.fillRect(p.x-3,hy,7,6);
      cx.fillStyle=emp.hair;cx.fillRect(p.x-3,hy-2,8,3);cx.fillRect(p.x-4,hy-1,1,3);cx.fillRect(p.x+5,hy-1,1,3);
      // 눈 (주위 둘러보기)
      const look=Math.sin(t*0.5)>0?1:0;
      cx.fillStyle='#222';cx.fillRect(p.x-2+look,hy+2,2,2);cx.fillRect(p.x+1+look,hy+2,2,2);
      cx.fillStyle='#fff';cx.fillRect(p.x-2+look,hy+2,1,1);cx.fillRect(p.x+1+look,hy+2,1,1);
      // 말풍선: "..."  또는 "💤"
      if(Math.sin(t*0.3)>0.2){
        cx.fillStyle='rgba(255,255,240,0.9)';cx.fillRect(p.x+4,hy-5,8,6);
        cx.fillStyle='#5a5530';cx.fillRect(p.x+4,hy-5,8,1);cx.fillRect(p.x+4,hy,8,1);cx.fillRect(p.x+4,hy-5,1,6);cx.fillRect(p.x+11,hy-5,1,6);
        cx.fillStyle='#888';cx.font='4px monospace';cx.textAlign='center';cx.fillText('...',p.x+8,hy-1);
      }
      // 이름
      cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(p.x-9,p.y+3,18,5);
      cx.fillStyle='#fff';cx.font='4px monospace';cx.textAlign='center';cx.fillText(emp.name,p.x,p.y+7);
    }
  });
}

// ===== 직원 클릭 → 일 시키기 =====
function onEmpClick(idx){
  const emp=S.emps[idx];
  if(emp.state==='working'){
    if(S.crafting&&S.crafting.empIdx===idx){
      const craft=CRAFTS.find(c=>c.id===S.crafting.craftId);
      const elapsed=(Date.now()-S.crafting.startTime)/1000;
      const pct=Math.min(100,Math.round(elapsed/S.crafting.duration*100));
      toast(`${craft.name} 제작 중... ${pct}%`);
    }
    return;
  }
  // 할 수 있는 작업 목록
  const eg=E[emp.gi];
  const available=CRAFTS.filter(c=>!S.unlocked.includes(c.id)&&c.req.every(r=>S.unlocked.includes(r)));
  if(available.length===0){
    toast('지금 만들 수 있는 기능이 없습니다');return;
  }

  document.getElementById('shTitle').textContent=`${emp.name}에게 시킬 작업`;
  const speed=eg.speed;
  document.getElementById('shBody').innerHTML=available.map(c=>{
    const canDo=emp.gi>=c.minRank;
    const rankName=E[c.minRank].rank;
    const time=Math.round(c.time/speed);
    return `<div class="btn ${canDo?'':'locked'}" onclick="${canDo?`startCraft('${c.id}',${idx})`:''}">
      <div class="ic" style="background:#4a4520;border-color:${canDo?'#8a8060':'#4a4520'};font-size:14px">${c.icon}</div>
      <div class="info"><div class="t" style="color:${canDo?'#ffe066':'#5a5530'}">${c.name}</div><div class="d">${canDo?c.desc:'🔒 '+rankName+' 이상 필요'}</div>${canDo?`<div class="d" style="color:#88aaaa">제작: ${time}초</div>`:''}</div>
      ${canDo?`<div class="cost" style="color:#66cc44">+${c.reward}원</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('shBg').classList.add('open');
}

function startCraft(craftId,empIdx){
  if(S.crafting){toast('이미 제작 중입니다',true);return;}
  const craft=CRAFTS.find(c=>c.id===craftId);
  const eg=E[S.emps[empIdx].gi];
  const duration=craft.time/eg.speed/S.speedBonus;

  S.crafting={craftId,empIdx,startTime:Date.now(),duration};
  S.emps[empIdx].state='working';
  closeSheet();
  toast(`${S.emps[empIdx].name}이(가) ${craft.name} 제작 시작!`);
  renderAll();
}

function closeSheet(){document.getElementById('shBg').classList.remove('open');}

// ===== 메인 화면 렌더 =====

      <div class="info"><div class="t">${emp.name} <span style="color:${eg.c}">${eg.rank}</span></div><div class="d">${stateText}</div></div></div>`;

  if(has('hire_system')){
    h+=`<div class="btn" onclick="openHire()" style="justify-content:center;border-style:dashed"><div class="info" style="text-align:center"><div class="t" style="color:#8a8060">+ 직원 채용</div></div></div>`;
  }
  h+=`</div></div>`;

  // 자동 수익 표시
  if(has('auto_prod')){
    const doneCount=S.missions.filter(m=>m.done).length;
    const idleEmps=S.emps.filter(e=>e.state==='idle');
    const baseIncome=idleEmps.reduce((s,e)=>s+10*E[e.gi].speed,0);
    const routineBonus=doneCount*50;
    const total=Math.round((baseIncome+routineBonus)*S.speedBonus);
    h+=`<div class="card"><div class="card-head"><div class="card-title">⚡ 자동 수익</div></div><div class="card-body">
      <div style="font-size:9px;display:flex;justify-content:space-between;padding:2px 0"><span>직원 생산</span><span style="color:#66cc44">+${Math.round(baseIncome)}/3초</span></div>
      <div style="font-size:9px;display:flex;justify-content:space-between;padding:2px 0"><span>루틴 보너스 (${doneCount}개)</span><span style="color:#ffe066">+${routineBonus}/3초</span></div>
      ${S.speedBonus>1?`<div style="font-size:9px;display:flex;justify-content:space-between;padding:2px 0"><span>속도 보너스</span><span style="color:#cc88ff">x${S.speedBonus}</span></div>`:''}
      <div style="font-size:10px;display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #5a5530;margin-top:4px"><span style="font-weight:bold">합계</span><span style="color:#66cc44;font-weight:bold">+${total}/3초</span></div>
    </div></div>`;
  }

  // 상점
  h+=`<div class="card"><div class="card-head"><div class="card-title">🛒 상점</div></div><div class="card-body">`;
  SHOP.forEach(item=>{
    const owned=hasItem(item.id);
    const isIAP=item.type==='iap';
    const afford=isIAP||item.cost<=S.money;
    if(owned&&!isIAP){
      h+=`<div class="btn locked"><div class="ic" style="background:#2a3a2a;border-color:#44aa44;font-size:12px">${item.icon}</div><div class="info"><div class="t" style="color:#44aa44">${item.name}</div><div class="d">보유 중</div></div></div>`;
    } else {
      h+=`<div class="btn ${afford?'':'locked'}" onclick="${isIAP?`buyIAP('${item.id}')`:(afford?`buyItem('${item.id}')`:'')}">
        <div class="ic" style="background:#4a4520;border-color:${isIAP?'#cc88ff':'#8a8060'};font-size:12px">${item.icon}</div>
        <div class="info"><div class="t" style="color:${isIAP?'#cc88ff':'#ffe066'}">${item.name}</div><div class="d">${item.desc}</div></div>
        <div class="cost" style="color:${isIAP?'#cc88ff':'#66cc44'}">${typeof item.cost==='number'?item.cost.toLocaleString()+'원':item.cost}</div>
      </div>`;
    }
  });
  h+=`</div></div>`;

  // 해금 진행도
  const unlockCount=S.unlocked.length;
  const totalCount=CRAFTS.length;
  h+=`<div class="card"><div class="card-head"><div class="card-title">🔓 해금 ${unlockCount}/${totalCount}</div></div><div class="card-body">`;
  CRAFTS.forEach(cr=>{
    const done=S.unlocked.includes(cr.id);
    const avail=!done&&cr.req.every(r=>S.unlocked.includes(r));
    const rankOk=S.emps.some(e=>e.gi>=cr.minRank);
    h+=`<div style="font-size:9px;padding:3px 0;color:${done?'#66cc44':avail&&rankOk?'#ffe066':avail?'#aa6622':'#4a4520'}">${done?'✅':avail?'🔨':'🔒'} ${cr.name}${done?' · 완료':avail&&!rankOk?' · '+E[cr.minRank].rank+' 필요':''}</div>`;
  });
  h+=`</div></div>`;

  c.innerHTML=h;

  // 프로그래스 바 업데이트
  if(S.crafting){
    updateProgBar();
  }
}

function updateProgBar(){
  if(!S.crafting)return;
  const bar=document.getElementById('craftProg');
  if(!bar)return;
  const pct=Math.min(100,(Date.now()-S.crafting.startTime)/1000/S.crafting.duration*100);
  bar.style.width=pct+'%';
  if(pct<100)requestAnimationFrame(updateProgBar);
}

// ===== 루틴 =====
function addRoutine(){
  document.getElementById('shTitle').textContent='루틴 추가';
  document.getElementById('shBody').innerHTML=`<div style="padding:8px">
    <input id="routineInput" type="text" placeholder="예: 걷기 15분" maxlength="20" style="width:100%;padding:10px;background:#2a2510;border:2px solid #5a5530;color:#ffe066;font-family:inherit;font-size:11px;margin-bottom:8px">
    <div class="btn" onclick="confirmRoutine()" style="justify-content:center;background:#4a6a2a;border-color:#66aa44"><div class="info" style="text-align:center"><div class="t" style="color:#ccff88">▸ 추가</div></div></div>
  </div>`;
  document.getElementById('shBg').classList.add('open');
  setTimeout(()=>{const i=document.getElementById('routineInput');if(i)i.focus();},300);
}

function confirmRoutine(){
  const v=document.getElementById('routineInput').value.trim();
  if(!v)return;
  S.missions.push({text:v,done:false});
  closeSheet();renderAll();
  toast(`루틴 추가: ${v}`);
}

function toggleRoutine(mi){
  if(!has('routine_check'))return;
  S.missions[mi].done=!S.missions[mi].done;
  if(S.missions[mi].done){
    const bonus=has('auto_prod')?300:100;
    S.money+=bonus;
    toast(`✅ ${S.missions[mi].text} +${bonus}원`);
  }
  renderAll();
}

// ===== 채용 =====
function openHire(){
  document.getElementById('shTitle').textContent='직원 채용';
  document.getElementById('shBody').innerHTML=E.map((g,gi)=>{
    const afford=g.cost<=S.money;
    return `<div class="btn ${afford?'':'locked'}" onclick="${afford?'hireEmp('+gi+')':''}">
      <div class="ic" style="background:${g.bg};border-color:${g.c};font-size:12px">★</div>
      <div class="info"><div class="t" style="color:${g.c}">${g.rank}</div><div class="d">${g.skill} · ${g.desc}</div><div class="d" style="color:#88aaaa">제작 속도: x${g.speed}</div></div>
      <div class="cost" style="color:${afford?'#66cc44':'#ff6666'}">${g.cost.toLocaleString()}원</div>
    </div>`;
  }).join('');
  document.getElementById('shBg').classList.add('open');
}

function hireEmp(gi){
  if(E[gi].cost>S.money)return;
  S.money-=E[gi].cost;
  S.emps.push(mkEmp(gi));
  closeSheet();renderAll();
  toast(`${S.emps.at(-1).name} ${E[gi].rank} 채용!`);
}

// ===== 상점 =====
function buyItem(id){
  const item=SHOP.find(i=>i.id===id);
  if(!item||item.cost>S.money||hasItem(id))return;
  S.money-=item.cost;
  // 효과 적용
  if(item.effect==='speed_10')S.speedBonus+=0.1;
  if(item.effect==='speed_20')S.speedBonus+=0.2;
  // 배치 모드 진입
  placingItem={id:item.id,icon:item.icon,name:item.name};
  toast(`📍 사무실을 탭해서 ${item.name}을 배치하세요`);
  renderAll();
}

function buyIAP(id){
  const item=SHOP.find(i=>i.id===id);
  if(!item)return;
  if(confirm(`${item.cost}을 결제하시겠습니까?\n(데모: 무료로 지급됩니다)`)){
    S.money+=item.give;
    toast(`💎 ${item.give.toLocaleString()}원 획득!`);
    renderAll();
  }
}

// ===== 다음 날 =====
function nextDay(){
  S.day++;
  S.missions.forEach(m=>m.done=false);
  renderAll();
  toast(`DAY ${String(S.day).padStart(3,'0')}`);
}

function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
</script>
</body>
</html>
